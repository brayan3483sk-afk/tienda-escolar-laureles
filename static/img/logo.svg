<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 100,15 C 150,15 175,30 175,90 C 175,145 125,175 100,185 C 75,175 25,145 25,90 C 25,30 50,15 100,15 Z" 
        fill="url(#bgGrad)" stroke="#ffb703" stroke-width="5" />
  
  <!-- Inner Shield Border -->
  <path d="M 100,25 C 140,25 162,38 162,90 C 162,136 120,162 100,172 C 80,162 38,136 38,90 C 38,38 60,25 100,25 Z" 
        fill="none" stroke="#d90429" stroke-width="3" />

  <!-- Laurel Wreath Left -->
  <path d="M 45,95 C 45,70 60,50 75,45 M 48,85 C 55,75 65,70 70,68 M 45,105 C 50,118 62,125 72,130" 
        fill="none" stroke="#ffb703" stroke-width="3" stroke-linecap="round" />
        
  <!-- Laurel Wreath Right -->
  <path d="M 155,95 C 155,70 140,50 125,45 M 152,85 C 145,75 135,70 130,68 M 155,105 C 150,118 138,125 128,130" 
        fill="none" stroke="#ffb703" stroke-width="3" stroke-linecap="round" />

  <!-- Sun Rays Top -->
  <circle cx="100" cy="65" r="18" fill="url(#goldGrad)" />
  
  <!-- Open Book Symbol -->
  <path d="M 70,110 Q 100,102 100,115 Q 100,102 130,110 L 130,135 Q 100,126 100,138 Q 100,126 70,135 Z" 
        fill="#ffffff" stroke="#1b4332" stroke-width="2" />
  <line x1="100" y1="115" x2="100" y2="138" stroke="#d90429" stroke-width="2" />

  <!-- Stars -->
  <polygon points="100,32 103,39 110,40 105,45 106,52 100,48 94,52 95,45 90,40 97,39" fill="#ffb703" />
</svg>
