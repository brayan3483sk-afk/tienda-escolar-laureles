{% extends 'base.html' %}

{% block title %}Página No Encontrada (Error 404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card border-0 shadow-lg rounded-4 p-5 mx-auto" style="max-width: 600px;">
    <div class="display-1 text-danger fw-extrabold mb-3">404</div>
    <h3 class="fw-bold text-dark mb-3">¡Página no encontrada!</h3>
    <p class="text-muted mb-4">La dirección a la que intentas acceder no existe en la Tienda Escolar Virtual o ha sido movida.</p>
    <div>
      <a href="{{ url_for('menu.index') }}" class="btn btn-laureles-primary btn-lg rounded-pill px-4">
        <i class="bi bi-house-door-fill me-2"></i>Volver al Catálogo Principal
      </a>
    </div>
  </div>
</div>
{% endblock %}
