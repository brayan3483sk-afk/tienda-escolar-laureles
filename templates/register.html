{% extends 'base.html' %}

{% block title %}Crear Cuenta{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-header text-center py-4 text-white" style="background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%); border-bottom: 4px solid #ffb703;">
          <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="Escudo Laureles" width="70" class="mb-2" style="border-radius: 50%;">
          <h4 class="fw-bold mb-0">Crear una Cuenta</h4>
          <p class="small mb-0 text-warning">I.E.D. Los Laureles</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <form action="{{ url_for('auth.register') }}" method="POST">
            
            <div class="mb-3">
              <label for="nombre" class="form-label fw-bold text-secondary"><i class="bi bi-person-badge-fill me-1"></i>Nombre Completo</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person-vcard text-success"></i></span>
                <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="usuario" class="form-label fw-bold text-secondary"><i class="bi bi-person-fill me-1"></i>Nombre de Usuario</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person text-success"></i></span>
                <input type="text" class="form-control form-control-lg" id="usuario" name="usuario" placeholder="Ej: jperez" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="contrasena" class="form-label fw-bold text-secondary"><i class="bi bi-lock-fill me-1"></i>Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key text-success"></i></span>
                <input type="password" class="form-control form-control-lg" id="contrasena" name="contrasena" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-laureles-primary btn-lg w-100 fw-bold mb-3">
              <i class="bi bi-person-plus-fill me-2"></i>Registrarse
            </button>
          </form>

          <hr class="my-4 text-muted">

          <div class="text-center mt-3">
            <span class="text-muted">¿Ya tienes cuenta?</span> 
            <a href="{{ url_for('auth.login') }}" class="fw-bold text-success text-decoration-none">Inicia sesión aquí</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
