services:
  - type: web
    name: tienda-escolar-laureles
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTO_INIT_DB
        value: "true"
      # Conexión PostgreSQL de Render o MySQL externa (mysql://usuario:clave@host:3306/db)
      - key: DATABASE_URL
        sync: false
      - key: NGROK_URL
        sync: false
